nome: v04 — sensibilidade P2 (preços iguais) + E1
descricao: Parâmetros da Rodada 05 (D1=C, D2=D3=D4=D6=D7=A, D5=E1, D8=A, D9=a+b+f+r,
  D10=Sulgás, V1, V2, D17=A, D18=A, D19=A, D21=A); gerado por scripts/rodada05_parametros.py;
  fontes em cada linha dos CSVs e em quadro_parametros_v04.xlsx
setor_alvo: S38
regioes:
- RS
- RB
bloco_intrassetorial: roteamento_por_componentes
modo_vbp: ancora_componentes
subsetor_termica_gas: S38_GN
ras:
  tolerancia: 1.0e-08
  max_iter: 20000
niveis:
  co2e:
    modo: residuo
    residuo_para:
    - S38_DIS
    - S38_GAS
piso_vbp:
  kappa: 0.7
  combustiveis:
    S38_CAR:
    - S04
    S38_GN:
    - S05
    - importacoes
    S38_PET:
    - S19
    S38_BIO:
    - S03
    - S09
  max_iter: 50
reequilibrio:
  eta: 0.1
  linhas_fixas:
  - S04
  - S05
  - S19
  - S03
  - S09
  primarios_ajustaveis:
  - ipi
  - icms
  - outros_impostos
  importacoes: fixas
  se_inviavel: erro
tust_latentes:
  gwh_espelho:
    S38_SOL: 4978.0
    S38_PET: 5174.0
  fonte: 'HIPÓTESE (D18, Rodada 05): as colunas latentes do RS pagam a TUST por MWh
    das fontes do RS no SIN (regra da V1), ao R$/MWh do espelho do RB (VBP do espelho
    ÷ GWh da D8, geracao_2019_regiao_subsetor_v03.csv), e não a TUST por real do espelho'
alerta_multiplicador_producao: 2.2
alerta_insumos_nao_energeticos: 0.05
arquivos:
  subsetores: subsetores_v04.csv
  participacoes_vbp: participacoes_vbp_v04_P2.csv
  componentes: componentes_v04.csv
  regras_coluna: regras_coluna_v04.csv
  regras_linha: regras_linha_v04.csv
  regras_primarios: regras_primarios_v04.csv
  latentes_espelho: latentes_espelho_v04.csv
  pesos_tust_geracao: pesos_tust_geracao_v04.csv
